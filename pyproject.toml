[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction"
version = "0.1.0"
description = "Reproducible telecom customer churn prediction baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3.0",
  "numpy>=1.24",
  "scikit-learn>=1.4,<2.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "joblib>=1.3"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
boost = ["xgboost>=2.0"]
explain = ["shap>=0.45"]
tracking = ["mlflow>=2.12"]
app = ["streamlit>=1.35", "fastapi>=0.111", "uvicorn[standard]>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
